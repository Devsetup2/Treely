<!doctype html>
<html lang="tr" data-season="summer">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" />
    <title>Treely — Sakin Link Kısaltıcı</title>
    <meta
      name="description"
      content="Uzun bağlantıları kısalt, 3D bir ağaca dönüştür. Mevsimi seç, QR kodunu indir, paylaş."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" crossorigin src="/assets/index-CGIz8TtO.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D8Hyz6Ij.css">
  </head>
  <body>
    <div id="app">
      <header class="brand" aria-label="Treely">
        <div class="logo" id="logo"></div>
        <span class="pill"><i class="pill-dot"></i><span data-i18n="pill">link kısaltıcı</span></span>
      </header>

      <button class="icon-btn info-btn" id="infoBtn" type="button" aria-label="Bilgi" data-i18n-aria="info">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.7" r=".6" fill="currentColor"/></svg>
      </button>

      <main class="stage">
        <div id="scene" class="scene" role="img" aria-label="3D ağaç"></div>

        <div class="qr-layer" id="qrLayer" hidden>
          <div class="qr-card" id="qrCard">
            <canvas id="qrCanvas" width="640" height="640"></canvas>
            <div class="qr-url" id="qrUrl"></div>
            <div class="qr-actions">
              <button type="button" class="chip" id="qrDownload" data-i18n="download">QR'ı indir</button>
              <button type="button" class="chip ghost" id="qrClose" data-i18n="close">Kapat</button>
            </div>
          </div>
        </div>
      </main>

      <button class="hint" id="hint" type="button" data-i18n="hint">QR kodu görmek için ağaca dokun</button>

      <section class="controls">
        <form class="field-row" id="linkForm" autocomplete="off" novalidate>
          <div class="field" id="field">
            <input
              id="urlInput"
              type="text"
              inputmode="url"
              spellcheck="false"
              autocapitalize="off"
              autocorrect="off"
              aria-label="Bağlantı"
              data-i18n-placeholder="placeholder"
              placeholder="Uzun bir bağlantıyı yapıştır…"
            />
            <button class="shorten" id="shortenBtn" type="submit">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6.5" r="2.6"/><circle cx="6" cy="17.5" r="2.6"/><path d="M8.2 8l11.3 9M8.2 16l11.3-9"/></svg>
              <span data-i18n="shorten">Kısalt</span>
            </button>
          </div>

          <div class="share-wrap">
            <button class="share" id="shareBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Paylaş" data-i18n-aria="share">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5v6.2A1.8 1.8 0 0 0 6.8 20.5h10.4a1.8 1.8 0 0 0 1.8-1.8v-6.2"/></svg>
            </button>

            <div class="menu" id="menu" role="menu" hidden>
              <button role="menuitem" type="button" data-act="copy">
                <svg viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
                <span data-i18n="copy">Bağlantıyı kopyala</span>
              </button>
              <button role="menuitem" type="button" data-act="download">
                <svg viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10 12 14.5 16.5 10"/><path d="M4.5 15.5v3A1.8 1.8 0 0 0 6.3 20.3h11.4a1.8 1.8 0 0 0 1.8-1.8v-3"/></svg>
                <span data-i18n="download">QR'ı indir</span>
              </button>
              <hr />
              <button role="menuitem" type="button" data-act="x">
                <svg viewBox="0 0 24 24" class="fill"><path d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.3L5.3 21H2.2l7.2-8.3L1.8 3h6.4l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.2 4.7H5.4l11.3 14.5Z"/></svg>
                <span data-i18n="shareX">X'te paylaş</span>
              </button>
              <button role="menuitem" type="button" data-act="facebook">
                <svg viewBox="0 0 24 24" class="fill"><path d="M12 2.2a9.8 9.8 0 0 0-1.5 19.5v-6.9H8v-2.9h2.5V9.7c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6v1.9h2.8l-.4 2.9h-2.4v6.9A9.8 9.8 0 0 0 12 2.2Z"/></svg>
                <span data-i18n="shareFb">Facebook'ta paylaş</span>
              </button>
              <button role="menuitem" type="button" data-act="whatsapp">
                <svg viewBox="0 0 24 24"><path d="M3.6 20.4 5 15.6a8.4 8.4 0 1 1 3.2 3.1l-4.6 1.7Z"/><path d="M9.2 8.6c.2 2.9 2.7 5.4 5.6 5.7l1.1-1.3-2-1-.9.7c-.9-.4-1.8-1.3-2.2-2.2l.7-.9-1-2-1.3 1Z" fill="currentColor" stroke="none"/></svg>
                <span data-i18n="shareWa">WhatsApp'ta paylaş</span>
              </button>
            </div>
          </div>
        </form>

        <div class="row2" role="group" aria-label="Mevsim">
          <button class="season" type="button" data-season="spring">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="2.1"/><path d="M12 9.9C10.4 8.6 9.3 7.2 9.3 5.7a2.7 2.7 0 0 1 5.4 0c0 1.5-1.1 2.9-2.7 4.2ZM14.1 12c1.3-1.6 2.7-2.7 4.2-2.7a2.7 2.7 0 0 1 0 5.4c-1.5 0-2.9-1.1-4.2-2.7ZM12 14.1c1.6 1.3 2.7 2.7 2.7 4.2a2.7 2.7 0 0 1-5.4 0c0-1.5 1.1-2.9 2.7-4.2ZM9.9 12c-1.3 1.6-2.7 2.7-4.2 2.7a2.7 2.7 0 0 1 0-5.4c1.5 0 2.9 1.1 4.2 2.7Z"/></svg>
            <span data-i18n="spring">İlkbahar</span>
          </button>
          <button class="season active" type="button" data-season="summer">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
            <span data-i18n="summer">Yaz</span>
          </button>
          <button class="season" type="button" data-season="autumn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15.5A4.5 4.5 0 0 1 8 6.6 5.5 5.5 0 0 1 18.4 8a3.8 3.8 0 0 1-.9 7.5"/><path d="M9 18.5v2M12.5 17.5v3M16 18.5v2"/></svg>
            <span data-i18n="autumn">Sonbahar</span>
          </button>
          <button class="icon-btn sound" id="soundBtn" type="button" aria-pressed="false" aria-label="Ses" data-i18n-aria="sound">
            <svg class="off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3l4.5-3.7v12.4L7 14.5H4Z"/><path d="m16 9.5 4 5M20 9.5l-4 5"/></svg>
            <svg class="on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3l4.5-3.7v12.4L7 14.5H4Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.2 6.5a7.6 7.6 0 0 1 0 11"/></svg>
          </button>
        </div>
      </section>
    </div>

    <dialog id="info" class="info-dialog">
      <form method="dialog">
        <h2 data-i18n="infoTitle">Treely nedir?</h2>
        <p data-i18n="infoBody1"></p>
        <p data-i18n="infoBody2"></p>
        <button class="chip" data-i18n="close">Kapat</button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
